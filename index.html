<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday 🎂</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body{
    margin: 0;
    min-height: 100dvh;
    display: flex;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color: #fff;
    background: radial-gradient(120% 90% at 50% 0%, #3a1c63 0%, #1c0d33 45%, #0b0514 100%);
    overflow-x: hidden;
  }
  .stars{
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 35% 62%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 88% 58%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 55% 88%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 22% 78%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 65% 35%, rgba(255,255,255,.55), transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .45 } to { opacity: 1 } }
  #balloons{ position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .balloon{
    position: absolute; bottom: -180px;
    border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
    animation-name: rise; animation-timing-function: linear;
    animation-iteration-count: infinite; opacity: .9; will-change: transform;
  }
  .balloon::after{
    content: ""; position: absolute; top: 100%; left: 50%;
    width: 1px; height: 46px;
    background: linear-gradient(rgba(255,255,255,.5), transparent);
  }
  @keyframes rise{
    0%   { transform: translate3d(0, 0, 0)        rotate(-4deg); }
    50%  { transform: translate3d(28px, -58vh, 0) rotate(5deg); }
    100% { transform: translate3d(-18px, -128vh, 0) rotate(-4deg); }
  }
  #confetti{ position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  .stage{
    position: relative; z-index: 2; margin: auto;
    padding: 40px 20px 60px; text-align: center;
    max-width: 760px; width: 100%;
  }
  .eyebrow{
    margin: 0 0 14px; font-size: .72rem; letter-spacing: .35em;
    text-transform: uppercase; color: rgba(255,255,255,.55);
    animation: fadeUp .9s .1s both;
  }
  .title{
    margin: 0; font-size: clamp(2rem, 8.5vw, 4.2rem); line-height: 1.1;
    font-weight: 800; color: #ffd97a;
    text-shadow: 0 0 28px rgba(255,190,80,.45), 0 6px 0 rgba(0,0,0,.18);
  }
  .word{ display: inline-block; white-space: nowrap; }
  .letter{ display: inline-block; animation: pop .65s cubic-bezier(.34,1.56,.64,1) backwards; }
  @keyframes pop{
    from{ opacity: 0; transform: translateY(28px) scale(.6) rotate(-8deg); }
    to  { opacity: 1; transform: none; }
  }
  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(14px); }
    to  { opacity: 1; transform: none; }
  }
  .cake-wrap{
    margin: 26px auto 8px; display: flex; justify-content: center;
    animation: fadeUp 1s .5s both;
  }
  .cake{ position: relative; width: 300px; height: 240px; }
  .plate{
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 290px; height: 18px; border-radius: 50%;
    background: linear-gradient(180deg, #dfe5f2, #79839a);
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
  }
  .tier{
    position: absolute; left: 50%; transform: translateX(-50%);
    border-radius: 12px;
    box-shadow: inset -14px 0 22px rgba(0,0,0,.16), inset 14px 0 18px rgba(255,255,255,.14);
  }
  .tier::before{
    content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 20px;
    border-radius: 12px 12px 60% 60% / 12px 12px 100% 100%;
    background: linear-gradient(180deg, #fff8fc, #ffe4f1);
    box-shadow: 0 3px 6px rgba(0,0,0,.12);
  }
  .tier-1{ bottom: 10px;  width: 240px; height: 62px; background: linear-gradient(180deg,#ff8ab8,#d94a78); }
  .tier-2{ bottom: 72px;  width: 195px; height: 56px; background: linear-gradient(180deg,#b48bff,#7a4ae0); }
  .tier-3{ bottom: 128px; width: 150px; height: 46px; background: linear-gradient(180deg,#6ee7cf,#27b79b); }
  .candles{
    position: absolute; left: 50%; bottom: 174px; transform: translateX(-50%);
    display: flex; gap: 16px; align-items: flex-end;
  }
  .candle{
    position: relative; width: 11px; height: 36px;
    padding: 0; border: 0; border-radius: 4px; cursor: pointer;
    background: repeating-linear-gradient(135deg, #ffffff 0 5px, #ff6ea9 5px 10px);
    box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .2s;
  }
  .candle:hover{ transform: translateY(-2px); }
  .wick{
    position: absolute; left: 50%; top: -6px; width: 2px; height: 7px;
    margin-left: -1px; border-radius: 1px; background: #4a3b2a;
  }
  .flame{
    position: absolute; left: 50%; top: -28px; width: 14px; height: 22px;
    margin-left: -7px; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
    background: radial-gradient(circle at 50% 78%, #fffbe6 0%, #ffe066 32%, #ff9f1c 62%, #ff5400 100%);
    box-shadow: 0 0 12px 3px rgba(255,175,60,.65), 0 0 34px 14px rgba(255,110,0,.28);
    transform-origin: 50% 100%;
    animation: flicker .16s ease-in-out infinite alternate;
    transition: opacity .35s, transform .35s;
  }
  @keyframes flicker{
    from{ transform: scale(1) rotate(-4deg); }
    to  { transform: scale(1.09, .93) rotate(4deg); }
  }
  .candle.out .flame{ opacity: 0; transform: scale(.15); animation: none; }
  .candle.out{ cursor: default; }
  .candle.out:hover{ transform: none; }
  .smoke{
    position: absolute; left: 50%; top: -26px; width: 10px; height: 10px;
    margin-left: -5px; border-radius: 50%;
    background: rgba(220,220,255,.65); filter: blur(3px);
    pointer-events: none; animation: puff 1.5s ease-out forwards;
  }
  @keyframes puff{
    from{ transform: translateY(0) scale(.6); opacity: .85; }
    to  { transform: translateY(-80px) scale(2.8); opacity: 0; }
  }
  .hint{
    margin: 18px 0 0; font-size: .95rem; color: rgba(255,255,255,.65);
    letter-spacing: .02em; animation: fadeUp 1s .8s both; transition: color .4s;
  }
  .message{
    margin: 26px auto 0; max-width: 560px; padding: 22px 26px;
    border-radius: 20px; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    font-size: 1.02rem; line-height: 1.65; color: rgba(255,255,255,.9);
    opacity: 0; transform: translateY(22px) scale(.97); pointer-events: none;
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1);
  }
  .message.show{ opacity: 1; transform: none; }
  @media (max-width: 420px){
    .cake-wrap{ transform: scale(.85); margin-top: 8px; margin-bottom: -12px; }
  }
  @media (prefers-reduced-motion: reduce){
    .balloon, .letter, .flame, .stars { animation: none !important; }
    .letter, .eyebrow, .cake-wrap, .hint { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div id="balloons"></div>
  <canvas id="confetti"></canvas>

  <main class="stage">
    <p class="eyebrow">A little something for you</p>
    <h1 class="title" id="title"></h1>
    <div class="cake-wrap">
      <div class="cake">
        <div class="candles" id="candles"></div>
        <div class="tier tier-3"></div>
        <div class="tier tier-2"></div>
        <div class="tier tier-1"></div>
        <div class="plate"></div>
      </div>
    </div>
    <p class="hint" id="hint">Tap the candles to blow them out 💨</p>
    <div class="message" id="message"></div>
  </main>

<script>
const CONFIG = {
  name: "Alex",
  candles: 5,
  wish:
    "Wishing you a year full of laughter, good health, and all the little things " +
    "that make you smile. May your coffee stay strong, your Wi-Fi stay fast, and " +
    "your cake always have extra frosting. 🎂",
};

const titleEl = document.getElementById("title");
let letterIndex = 0;
titleEl.innerHTML = `Happy Birthday, ${CONFIG.name}!`
  .split(" ")
  .map((word) =>
    `<span class="word">${Array.from(word)
      .map((ch) => `<span class="letter" style="animation-delay:${letterIndex++ * 45}ms">${ch}</span>`)
      .join("")}</span>`)
  .join(" ");

document.getElementById("message").textContent = CONFIG.wish;

const balloonColors = ["#ff6ea9","#ffd166","#8a5cf6","#4ee1c1","#ff9f1c","#66d9ff","#ff5f7e"];
const balloonLayer = document.getElementById("balloons");
for (let i = 0; i < 14; i++) {
  const b = document.createElement("div");
  const color = balloonColors[i % balloonColors.length];
  const size = 34 + Math.random() * 32;
  b.className = "balloon";
  b.style.width = size + "px";
  b.style.height = size * 1.2 + "px";
  b.style.left = Math.random() * 100 + "vw";
  b.style.background = `radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), transparent 42%), ${color}`;
  b.style.animationDuration = 15 + Math.random() * 14 + "s";
  b.style.animationDelay = -Math.random() * 26 + "s";
  balloonLayer.appendChild(b);
}

const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
const COLORS = ["#ff6ea9","#ffd166","#8a5cf6","#4ee1c1","#ff9f1c","#ffffff","#66d9ff"];
let vw = 0, vh = 0;
const particles = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth;
  vh = window.innerHeight;
  canvas.width = vw * dpr;
  canvas.height = vh * dpr;
  canvas.style.width = vw + "px";
  canvas.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function spawn(x, y, count = 60) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 9;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      size: 5 + Math.random() * 7,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.32,
      shape: Math.random() < 0.35 ? "circle" : "rect",
    });
  }
}

function tick() {
  ctx.clearRect(0, 0, vw, vh);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 0.18;
    p.vx *= 0.994; p.vy *= 0.994;
    p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
    if (p.y > vh + 80 || p.x < -100 || p.x > vw + 100) { particles.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === "circle") {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    }
    ctx.restore();
  }
  requestAnimationFrame(tick);
}
tick();

const candlesEl = document.getElementById("candles");
const hintEl = document.getElementById("hint");
const messageEl = document.getElementById("message");
let remaining = CONFIG.candles;

for (let i = 0; i < CONFIG.candles; i++) {
  const c = document.createElement("button");
  c.className = "candle";
  c.type = "button";
  c.setAttribute("aria-label", "Blow out candle");
  c.innerHTML = '<span class="wick"></span><span class="flame"></span>';
  c.addEventListener("click", () => blowOut(c));
  candlesEl.appendChild(c);
}

function blowOut(candle) {
  if (candle.classList.contains("out")) return;
  candle.classList.add("out");
  const r = candle.getBoundingClientRect();
  spawn(r.left + r.width / 2, r.top, 45);
  const smoke = document.createElement("span");
  smoke.className = "smoke";
  candle.appendChild(smoke);
  setTimeout(() => smoke.remove(), 1600);
  remaining--;
  if (remaining === 0) setTimeout(grandFinale, 550);
}

function grandFinale() {
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      spawn(vw * (0.15 + Math.random() * 0.7), vh * (0.2 + Math.random() * 0.4), 70);
    }, i * 170);
  }
  messageEl.classList.add("show");
  hintEl.textContent = "🎂 Wish made — have a wonderful year ahead!";
  hintEl.style.color = "rgba(255,217,122,.95)";
}

window.addEventListener("load", () => {
  setTimeout(() => spawn(vw / 2, vh * 0.42, 90), 700);
});
</script>
</body>
</html>
